name: campus_eats
description: "Campus Eats - VVU Food Pre-ordering App for Valley View University"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase - required packages only
  firebase_core: ^3.10.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0

  # Local offline-first cart storage (Week 4)
  hive_flutter: ^1.1.0

  # State management (Provider only, no BLoC/GetX)
  provider: ^6.1.2

  # Internationalisation - date/currency formatting
  intl: ^0.19.0

  # Image pick from camera or gallery (Admin menu upload)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
